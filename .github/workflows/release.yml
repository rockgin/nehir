name: Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Create a GitHub prerelease"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build release
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Check out Nehir main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - name: Plan release from changesets
        id: version
        env:
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          mise run release:plan

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version
          mise --version

      - name: Find last prerelease tag
        if: ${{ inputs.prerelease }}
        id: last-rc
        shell: bash
        run: |
          set -euo pipefail
          LAST_RC=$(git tag --list 'v*-*' --sort=-version:refname | head -1 || true)
          if [ -n "$LAST_RC" ]; then
            echo "since_tag=$LAST_RC" >> "$GITHUB_OUTPUT"
            echo "Last prerelease tag: $LAST_RC"
          else
            echo "No previous prerelease tag found; will include all changesets."
          fi

      - name: Apply release plan
        shell: bash
        run: |
          set -euo pipefail
          mise run release:apply -- "${{ steps.version.outputs.version }}"

      - name: Build release ZIP (ad-hoc signed)
        env:
          RELEASE_ZIP_PATH: ${{ github.workspace }}/${{ steps.version.outputs.zip }}
        run: mise run package:release

      - name: Render release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SINCE_TAG: ${{ steps.last-rc.outputs.since_tag || '' }}
          RELEASE_BYPASS_NOTARIZATION: true
        shell: bash
        run: |
          set -euo pipefail
          NOTES_ARGS=("$VERSION")
          if [ -n "$SINCE_TAG" ]; then
            NOTES_ARGS+=("--since-tag" "$SINCE_TAG")
          fi
          mise run release:notes -- "${NOTES_ARGS[@]}" > "$RUNNER_TEMP/release-notes.md"

      - name: Create release tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG" >&2
            exit 1
          fi
          git tag "$TAG"
          git push origin "$TAG"

      - name: Compute SHA-256
        id: checksum
        shell: bash
        run: |
          set -euo pipefail
          SHA256="$(shasum -a 256 "${{ steps.version.outputs.zip }}" | awk '{print $1}')"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "$SHA256  ${{ steps.version.outputs.zip }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ZIP: ${{ steps.version.outputs.zip }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists: $TAG" >&2
            exit 1
          fi
          args=(
            "$TAG"
            "$ZIP"
            --target "$(git rev-parse HEAD)"
            --title "Nehir ${TAG#v}"
            --notes-file "$RUNNER_TEMP/release-notes.md"
          )
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"

      - name: Clear released changesets
        if: ${{ !inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          # release:apply stamps Info.plist in the working tree for this run only.
          # Reset it so the generated stamp is never committed.
          git reset --hard HEAD

          git checkout main
          git pull --ff-only origin main

          find .changeset -maxdepth 1 -type f -name '*.md' ! -iname 'README.md' -delete

          if git diff --quiet -- .changeset; then
            echo "No released changesets to clear."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u .changeset
          git commit -m "Clear changesets after ${{ steps.version.outputs.tag }}"
          git push origin main
